databaseChangeLog:
  - changeSet:
      id: create-payment-table
      author: AnatoliiNazarov
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: booking_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: session_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: amount_to_pay
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  constraints:
                    nullable: false
                    defaultValue: false
              - addForeignKeyConstraint:
                  baseTableName: payments
                  baseColumnNames: booking_id
                  referencedTableName: booking
                  referencedColumnNames: id
                  constraintName: fk_booking_payment
